<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel de Indicações | GR Capital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img class="logo" src="../shared/assets/logo.png" alt="GR Capital">
  </header>

  <main id="login" class="login">
    <div class="kicker">GR Capital</div>
    <h1>Painel de <span>Indicações</span></h1>
    <p class="intro">Acompanhamento dos contatos indicados pelos seus clientes.</p>
    <label for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password">
    <div style="margin-top: 20px;">
      <button type="button" id="entrar-btn" class="primary">Entrar</button>
    </div>
    <div id="login-feedback" class="feedback" role="status"></div>
  </main>

  <main id="dashboard" class="dashboard" hidden>
    <div class="toolbar">
      <button type="button" id="exportar-btn" class="secondary">Baixar .xlsx</button>
      <button type="button" id="sair-btn" class="ghost">Sair</button>
    </div>
    <div class="kpis" id="kpis"></div>
    <div id="grupos"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="../shared/logic.js"></script>
  <script src="config.js"></script>
  <script src="painel.js"></script>
</body>
</html>
